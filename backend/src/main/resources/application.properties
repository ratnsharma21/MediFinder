# ==============================================================================
# MediFinder / MediCare - Application Configuration (Default)
# ==============================================================================

spring.application.name=medicare-backend
spring.profiles.active=dev

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Multipart File Upload Limits (Supports up to 20MB image uploads)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.enabled=true

# Jackson Serialization
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Springdoc OpenAPI Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Logging Configuration
logging.level.root=INFO
logging.level.com.medicare=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# AWS S3 Configuration
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.bucket-name=${AWS_S3_BUCKET:medi-finder}
aws.s3.region=${AWS_REGION:eu-north-1}

