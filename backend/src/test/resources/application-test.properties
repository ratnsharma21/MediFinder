# ==============================================================================
# MediFinder / MediCare - Test Profile (application-test.properties)
# ==============================================================================

# In-Memory H2 Database for Isolated Unit & Integration Tests
spring.datasource.url=jdbc:h2:mem:medicare_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Flyway disabled in test profile
spring.flyway.enabled=false

# JWT Security Test Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=3600000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
